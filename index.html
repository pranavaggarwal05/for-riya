<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pictures of You — As Seen by Me ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f6f4ef;
    padding:40px 20px;
    font-family:"Comic Sans MS","Segoe Script",cursive;
    animation:fadeIn 1.2s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

h1{
    text-align:center;
    margin-bottom:50px;
    font-size:36px;
    color:#444;
}

/* ROWS */
.row{
    display:flex;
    justify-content:center;
    gap:40px;
    margin-bottom:50px;
    flex-wrap:wrap;
}

/* POLAROID */
.photo{
    position:relative;
    background:white;
    padding:15px 15px 35px;
    width:260px;
    box-shadow:0 12px 25px rgba(0,0,0,0.18);
    border-radius:4px;
    transform:rotate(var(--r));
}

/* TAPE */
.photo::before{
    content:"";
    position:absolute;
    top:-12px;
    left:50%;
    transform:translateX(-50%) rotate(-3deg);
    width:80px;
    height:25px;
    background:repeating-linear-gradient(
        45deg,
        #f2d16b,
        #f2d16b 6px,
        #e6c25c 6px,
        #e6c25c 12px
    );
}

/* SLIDER */
.slider{
    overflow:hidden;
    height:260px;
}

.slides{
    display:flex;
    animation:slide 18s linear infinite;
}

/* IMAGE + VIDEO SAME SIZE */
.slides img,
.slides video{
    width:260px;
    height:260px;
    object-fit:cover;
    flex-shrink:0;
}

/* PAUSE ON HOVER */
.photo:hover .slides{
    animation-play-state:paused;
}

/* SEAMLESS LOOP */
@keyframes slide{
    from{transform:translateX(0);}
    to{transform:translateX(-780px);} /* 3 slides × 260px */
}

/* TEXT */
.caption{
    text-align:center;
    margin-top:14px;
    font-size:18px;
}

/* ROTATIONS */
.r1{--r:-3deg;}
.r2{--r:2deg;}
.r3{--r:-2deg;}
.r4{--r:3deg;}
.r5{--r:-1deg;}

.footer{
    text-align:center;
    margin-top:40px;
    font-size:18px;
    color:#555;
}

/* MOBILE */
@media(max-width:768px){
    .row{
        flex-direction:column;
        align-items:center;
    }
}
</style>
</head>

<body>

<h1>Pictures of You — As Seen by Me ❤️</h1>

<!-- TOP ROW -->
<div class="row">

    <!-- BEAUTIFUL -->
    <div class="photo r1">
        <div class="slider">
            <div class="slides">
                <img src="img11.png">
                <img src="img12.png">
                <img src="img13.png">
                <!-- clone first image -->
                <img src="img11.png">
            </div>
        </div>
        <div class="caption">Beautiful ✨</div>
    </div>

    <!-- CUTE (VIDEO + IMAGES) -->
    <div class="photo r2">
        <div class="slider">
            <div class="slides">
                <video autoplay loop muted playsinline>
                    <source src="riyavideo1.mp4" type="video/mp4">
                </video>
                <video autoplay loop muted playsinline>
                    <source src="riyavideo2.mp4" type="video/mp4">
                </video>
                <video autoplay loop muted playsinline>
                    <source src="riyavideo3.mp4" type="video/mp4">
                </video>
                <!-- clone first slide (video) -->
                <video autoplay loop muted playsinline>
                    <source src="riyavideo1.mp4" type="video/mp4">
                </video>
            </div>
        </div>
        <div class="caption">Cute 🥺</div>
    </div>

    <!-- HOT -->
    <div class="photo r3">
        <div class="slider">
            <div class="slides">
                <img src="img7.png">
                <img src="img8.png">
                <img src="img9.png">
                <!-- clone -->
                <img src="img7.png">
            </div>
        </div>
        <div class="caption">Hot 🔥</div>
    </div>

</div>

<!-- BOTTOM ROW -->
<div class="row">

    <!-- FUNNY -->
    <div class="photo r4">
        <div class="slider">
            <div class="slides">
                <img src="img3.png">
                <img src="img5.png">
                <img src="img6.png">
                <img src="img3.png">
            </div>
        </div>
        <div class="caption">Funny 😄</div>
    </div>

    <!-- FAVORITE -->
    <div class="photo r5">
        <div class="slider">
            <div class="slides">
                <img src="img1.png">
                <img src="img2.png">
                <img src="img4.png">
                <img src="img1.png">
            </div>
        </div>
        <div class="caption">My Favorite ❤️</div>
    </div>

</div>

<div class="footer">
    Every version of you is my favorite 🤍
</div>

</body>
</html>
